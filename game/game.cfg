# The description of the game for SR-SDK/scons/game.py (keys: SR-SDK/README.md).

platform=win32
sdk_version=0.1
archs=llasm
modules=Game-main
variants=default
input_exe=disc:COMIX.EXE
link=separate
devices=pc64-linux,pc64-windows
program=comix-zone
# the game reaches its data at the addresses it had in Windows 95, so llasm
# copies the data into the guest's memory (see game/main.c)
llasm_flags=-guest-data-in-memory -pic
# winapi=no leaves out the Win32 API layer; runtime_skip=File.c,... single runtime files
