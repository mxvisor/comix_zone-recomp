# The description of the game for SR-SDK/scons/game.py (keys: SR-SDK/README.md).

platform=win32
sdk_version=0.1
archs=llasm
modules=Game-main
variants=default
input_exe=disc:COMIX.EXE
link=separate
devices=x64-linux,x64-windows,arm64-android
program=comix-zone
# Android (SR-SDK/tools/android_apk.py)
android_id=io.github.mxvisor.comixzone
android_name=Comix Zone
# the game reaches its data at the addresses it had in Windows 95
guest_data_in_memory=yes
# winapi=no leaves out the Win32 API layer; runtime_skip=File.c,... single runtime files

