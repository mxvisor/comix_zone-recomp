# Comix Zone settings
# --------------------
#
# The port reads this file from the game's directory, or the file given
# with --config-file=FILE. An environment variable of the same meaning
# (CZ_NOSOUND, CZ_NOMUSIC, CZ_SHADER) overrides it.


# Sound/Music settings
# --------------------
#
# Sound=on/off - digital sound
# Music=on/off - music (the CD's audio tracks)

Sound=on
Music=on


# Picture filter (a mod)
# ----------------------
#
# Display_Shader=none/smooth/pixelart/scanlines/crt - a filter of the
#   picture, which goes through OpenGL then:
#   smooth     sharp bilinear: crisp pixels at any window size
#   pixelart   Scale2x: the corners of diagonal lines are rounded off
#   scanlines  a lit line and a dark gap for each row, as on a tube
#   crt        scanlines, the mask of the three colours, a darker edge
# Display_Shader_Key=KEY/off - the key that goes through the filters
#   (F9; it works when a filter is set here; KEY is an SDL name: F9, Tab)
#   CZ_SHADER overrides Display_Shader

Display_Shader=none
Display_Shader_Key=F9

# Display_OSD_Key=KEY/off - the key that shows and hides the port's panel over
#   the picture: its size, the window, FPS, the gamepad and the port's keys
#   (F12; KEY is an SDL name: F12, F11)
Display_OSD_Key=F12
