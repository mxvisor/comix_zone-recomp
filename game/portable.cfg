# Portable configuration for Comix Zone (SR-SDK/tools/portable_cd.py)
# Paths are relative to the game repository's root.
#
# The game directory as the installer makes it (COMIX.MST, the MS Setup script of
# COMIX.INF): COMIX.EXE and the four help files (section [Comix]) and WAIL32.DLL
# (section [Comix32], Windows 95) in the directory. The rest of the installer's
# files belong to Windows (the system directory: WING32.DLL, WAIL16*.DLL, the
# Win32s files, the code pages) or to the installer itself. COMIX.INI is not
# installed: the disc has one (with language=4, a Japanese text), but the installer
# does not copy it, so the game keeps its defaults (and writes its own file).
# What the install leaves on the disc and the game reads from there stays at its
# disc path, so the directory is also the disc: SPRITES.BIN, SEQS.95 (SEQS.31
# is the sound of Windows 3.1).

# The disc image (the cue sheet the SDK reads is made in build/cd/): the one
# path outside the repository
image=../iso/Comix.bin

# What the installer does not copy: itself and the autostart, the files it
# copies to Windows (the system and Win32s files, the code pages), the packed
# originals of the files it unpacks (COMIX.EX_, COMIX_*.HL_, WAIL32.DL_), and
# the disc's COMIX.INI
skip_files=AUTORUN.* SETUP.* _MS*.EXE MS*.DLL MS*.INC SETUPAPI.INC COMIX.MST COMIX.INF COMIX.IN_ COMIX.INI INIUPD.DLL SEQS.31 WING*.* WAIL16*.* WAIL32S.* *.EX_ *.HL_ *.DL_ *.DR_ *.WN_ *.NL_ *.38_

# the packed files of the disc to unpack: the game, its help files, the Miles DLL
expand=COMIX.EX_ WING32.DL_ COMIX_UK.HL_ COMIX_DE.HL_ COMIX_FR.HL_ COMIX_ES.HL_ WAIL32.DL_

# music: the audio tracks of the disc
audio_dir=AUDIO
audio_cue=Comix.cue
audio=ogg

# the General MIDI bank the port plays the XMIDI sequences with (a trimmed
# FluidR3_GM; see game/install/soundfont.LICENSE)
extra_files=game/install/soundfont.sf2 game/install/soundfont.LICENSE
